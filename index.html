<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTT Student Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-gray-50">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white p-4 shadow">
    <div class="container mx-auto">
      <h1 class="text-2xl font-bold">UTT Student Guide</h1>
      <p class="text-sm text-blue-100">Cẩm nang số cho sinh viên UTT</p>
    </div>
  </header>

  <!-- DANH MỤC -->
  <section class="container mx-auto p-6">
    <h2 class="text-xl font-bold text-gray-800 mb-4">Danh mục</h2>
    <div id="categoriesGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3"></div>
  </section>

  <!-- ĐỊA ĐIỂM NỔI BẬT -->
  <section class="container mx-auto p-6">
    <h2 class="text-xl font-bold text-gray-800 mb-4">Địa điểm nổi bật</h2>
    <div id="featuredGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </section>

    <!-- BẢN ĐỒ -->
  <section class="container mx-auto p-6">
    <h2 class="text-xl font-bold text-gray-800 mb-4">Bản đồ địa điểm</h2>
    <div id="map" style="height: 400px; border-radius: 12px;" class="shadow"></div>
  </section>

  <!-- FOOTER -->
  <footer class="bg-gray-800 text-white p-6 mt-10 text-center">
    <p class="text-sm">© 2025 Nhóm UTT Student Guide</p>
  </footer>

  <!-- Nạp dữ liệu + code -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
