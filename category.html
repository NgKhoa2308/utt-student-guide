<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh mục địa điểm - UTT Student Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .gradient-header { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%); }
    .place-card { transition: all 0.3s ease; }
    .place-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.15); }
    .filter-btn.active { background: #2563eb; color: white; }
  </style>
</head>
<body class="bg-gray-50">

  <!-- HEADER -->
  <header class="gradient-header text-white sticky top-0 z-50 shadow-lg">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="bg-white/20 backdrop-blur rounded-lg p-2">
          <i class="fas fa-map-marked-alt text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">UTT Student Guide</h1>
          <p class="text-xs text-blue-100">Cẩm nang số sinh viên UTT</p>
        </div>
      </a>
      <a href="index.html" class="text-sm hover:text-yellow-300 transition">
        <i class="fas fa-home mr-1"></i>Trang chủ
      </a>
    </div>
  </header>

  <!-- TIÊU ĐỀ + SEARCH -->
  <section class="bg-white border-b border-gray-100 py-6 px-4">
    <div class="container mx-auto">
      <nav class="text-sm text-gray-500 mb-3">
        <a href="index.html" class="hover:text-blue-600">Trang chủ</a>
        <span class="mx-2">›</span>
        <span id="breadcrumb" class="text-gray-800 font-semibold">Tất cả địa điểm</span>
      </nav>
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h2 id="pageTitle" class="text-2xl md:text-3xl font-bold text-gray-800">
            Tất cả địa điểm
          </h2>
          <p id="resultCount" class="text-gray-500 text-sm mt-1">Đang tải...</p>
        </div>
        <div class="flex bg-gray-100 rounded-lg overflow-hidden w-full md:w-80">
          <input
            type="text"
            id="searchInput"
            placeholder="Tìm trong danh mục..."
            class="flex-1 px-4 py-2 text-gray-800 outline-none bg-transparent"
          >
          <button id="searchBtn" class="bg-blue-600 text-white px-4 hover:bg-blue-700">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- NỘI DUNG CHÍNH -->
  <main class="container mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

      <!-- SIDEBAR BỘ LỌC -->
      <aside class="lg:col-span-1">
        <div class="bg-white rounded-2xl shadow-md p-5 sticky top-24">
          <h3 class="font-bold text-gray-800 mb-4">
            <i class="fas fa-filter text-blue-600 mr-2"></i>Bộ lọc
          </h3>

          <!-- Lọc theo danh mục -->
          <div class="mb-5">
            <p class="text-sm font-semibold text-gray-600 mb-2">Danh mục</p>
            <div id="categoryFilter" class="flex flex-wrap gap-2">
              <!-- Render bằng JS -->
            </div>
          </div>

          <!-- Lọc theo giá -->
          <div class="mb-5">
            <p class="text-sm font-semibold text-gray-600 mb-2">Mức giá</p>
            <div id="priceFilter" class="space-y-2">
              <!-- Render bằng JS -->
            </div>
          </div>

          <!-- Nút reset -->
          <button id="resetFilter" class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg hover:bg-gray-200 transition text-sm">
            <i class="fas fa-redo mr-1"></i>Xóa bộ lọc
          </button>
        </div>
      </aside>

      <!-- DANH SÁCH ĐỊA ĐIỂM -->
      <section class="lg:col-span-3">
        <div id="placesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Render bằng JS -->
        </div>
        <div id="emptyState" class="hidden text-center py-16">
          <i class="fas fa-search text-6xl text-gray-300 mb-4"></i>
          <p class="text-gray-500 text-lg">Không tìm thấy địa điểm nào</p>
          <button id="clearSearch" class="mt-4 text-blue-600 hover:underline">
            Xóa bộ lọc và thử lại
          </button>
        </div>
      </section>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-white py-6 px-4 mt-12 text-center">
    <p class="text-sm text-gray-400">&copy; 2025 Nhóm UTT Student Guide</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/category.js"></script>
</body>
</html>
