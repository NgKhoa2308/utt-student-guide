[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Khanh", email = "khanhdacodau2007@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "dependency-injector>=4.49.1",
    "fastapi>=0.143.0",
    "greenlet>=3.5.6",
    "passlib>=1.7.4",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
